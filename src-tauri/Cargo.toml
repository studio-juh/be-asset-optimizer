[package]
name = "be-asset-optimizer"
version = "0.5.0"
description = "Blender-oriented texture and 3D asset optimizer"
authors = ["Be Asset Optimizer contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "dds"] }
webp = "0.3.1"
imagequant = "4.4.1"
png = "0.18.1"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel"] }
bytemuck = "1.24.0"
base64 = "0.22.1"
heif-oxide = "0.1.0"
rayon = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
